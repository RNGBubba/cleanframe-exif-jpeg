[project]
name = "cleanframe-exif"
version = "0.1.0"
description = "A small, safe CLI for removing EXIF metadata from JPEG images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.scripts]
cleanframe = "cleanframe.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["cleanframe"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
